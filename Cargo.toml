[package]
name = "rts"
version = "0.1.0"
edition = "2024"

[dependencies]
rustc-hash = "2"
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
fancy-regex = "0.14"

[profile.release]
debug = true
panic = "abort"
codegen-units = 1
lto = "thin"

[features]
# Tracing garbage collection instead of reference counting (for comparison).
gc = []
