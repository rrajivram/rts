[package]
name = "rts"
version = "0.1.0"
edition = "2024"

[dependencies]
rustc-hash = "2"
indexmap = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
fancy-regex = "0.14"
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"

[profile.release]
debug = true
panic = "abort"
codegen-units = 1
lto = "thin"

[features]
# Tracing garbage collection instead of reference counting (for comparison).
gc = []
# Per-instruction counts, self time and allocations (`rts --profile`).
profile = []
